  <script src="deploy.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async function() {
    // 加载地区选项到户籍城市输入框（改为下拉）
    const hukouInput = document.querySelector('input[placeholder="例如：上海"]')
    if (hukouInput) {
      const select = document.createElement('select')
      select.className = hukouInput.className
      select.id = 'hukou-city'
      select.innerHTML = '<option value="">请选择</option>'
      try {
        const regions = await BayPier.getRegions(2)
        regions.forEach(r => {
          select.innerHTML += `<option value="${r.id}">${r.name}</option>`
        })
      } catch(e) { console.error(e) }
      hukouInput.parentNode.replaceChild(select, hukouInput)
    }

    // 添加意向城市多选
    const majorInput = document.querySelectorAll('.relative')[5] // 专业字段后
    if (majorInput) {
      const targetDiv = document.createElement('div')
      targetDiv.className = 'relative md:col-span-2'
      targetDiv.innerHTML = `
        <label class="block font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-2">意向发展城市（可多选）</label>
        <div id="target-cities" class="flex flex-wrap gap-2"></div>
      `
      const grid = document.querySelector('.grid.grid-cols-1.md\\:grid-cols-2.gap-8')
      if (grid) grid.appendChild(targetDiv)

      // 加载城市复选框
      try {
        const regions = await BayPier.getRegions(2)
        const container = document.getElementById('target-cities')
        regions.forEach(r => {
          container.innerHTML += `
            <label class="flex items-center gap-2 bg-surface-container-high px-3 py-2 rounded-lg cursor-pointer hover:bg-primary-fixed/30 transition-colors">
              <input type="checkbox" class="target-city-cb rounded" value="${r.id}" data-name="${r.name}">
              <span class="text-sm">${r.name}</span>
            </label>
          `
        })
      } catch(e) { console.error(e) }
    }

    // 表单提交 → 保存画像 → 跳转匹配
    const form = document.querySelector('form')
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault()

        const selects = form.querySelectorAll('select')
        const inputs = form.querySelectorAll('input')
        const textarea = form.querySelector('textarea')

        // 收集意向城市
        const targetCities = []
        document.querySelectorAll('.target-city-cb:checked').forEach(cb => {
          targetCities.push(cb.dataset.name)
        })

        const profile = {
          gender: selects[0]?.value || '',
          birthday: inputs[0]?.value || '',
          hukouCity: selects[1]?.options[selects[1].selectedIndex]?.text || '',
          degree: selects[2]?.value || '',
          school: inputs[1]?.value || '',
          major: inputs[2]?.value || '',
          experience: textarea?.value || '',
          targetCity: targetCities.length ? targetCities.join(',') : ''
        }

        BayPier.saveProfile(profile)
        window.location.href = 'match.html'
      })
    }
  })
  </script>
