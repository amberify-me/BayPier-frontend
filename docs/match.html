<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>白漂 BayPier - 政策库</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "primary-fixed":"#d0e4ff","outline":"#707883","surface-container":"#edeeef",
          "primary":"#005f9c","outline-variant":"#bfc7d4","secondary-container":"#cfe6f2",

          "surface-container-low":"#f3f4f5","primary-fixed-dim":"#9ccaff",
          "on-primary":"#ffffff","on-surface-variant":"#3f4752",
          "surface":"#f8f9fa","surface-container-lowest":"#ffffff",
          "surface-container-high":"#e7e8e9","error":"#ba1a1a"
        },
        fontFamily: { "headline":["Manrope","sans-serif"], "body":["Plus Jakarta Sans","sans-serif"] },
      }
    }
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  body { min-height: 100dvh; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body class="bg-surface font-body text-on-surface">

<!-- Header -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md shadow-[0_4px_20px_rgba(0,95,156,0.06)]">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-7xl mx-auto">
  <a href="index.html" class="flex items-center gap-2 no-underline">
    <span class="material-symbols-outlined text-sky-600">bubble_chart</span>
    <span class="text-xl font-black text-sky-700 tracking-tighter font-headline">白漂 BayPier</span>
  </a>
  <nav class="hidden md:flex items-center gap-8">
    <a class="text-slate-500 hover:bg-sky-50 px-3 py-1 rounded-lg text-sm font-headline" href="index.html">首页</a>
    <a class="text-sky-700 font-bold text-sm font-headline" href="match.html">政策库</a>
    <a class="text-slate-500 hover:bg-sky-50 px-3 py-1 rounded-lg text-sm font-headline" href="resume.html">个人中心</a>
  </nav>
</div>
</header>

<main class="pt-24 pb-32 px-6 max-w-7xl mx-auto">

<section class="mb-8">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-2">
    <div>
      <h1 class="font-headline text-3xl md:text-5xl font-extrabold tracking-tight mb-2" id="results-title">政策库</h1>
      <p class="text-on-surface-variant text-base" id="results-subtitle">选择城市查看该地区的人才补贴政策</p>
    </div>
    <div class="w-full md:w-64 flex-shrink-0" id="city-selector"></div>
  </div>
</section>

<!-- 政策列表 -->
<div id="results-list">
  <div class="text-center py-16 text-on-surface-variant"><p>加载中...</p></div>
</div>

</main>

<!-- Bottom Nav -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-white/90 backdrop-blur-xl z-50 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.03)]">
  <a class="flex flex-col items-center text-slate-400 px-5 py-2" href="index.html">
    <span class="material-symbols-outlined">home</span><span class="text-[11px] font-semibold">首页</span>
  </a>
  <a class="flex flex-col items-center bg-sky-100 text-sky-700 rounded-2xl px-5 py-2" href="match.html">
    <span class="material-symbols-outlined">description</span><span class="text-[11px] font-semibold">政策库</span>
  </a>
  <a class="flex flex-col items-center text-slate-400 px-5 py-2" href="resume.html">
    <span class="material-symbols-outlined">person</span><span class="text-[11px] font-semibold">我的</span>
  </a>
</nav>

<script src="deploy.js"></script>
